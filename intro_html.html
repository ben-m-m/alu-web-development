<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="intro_css.css">
    <title>Form Validation</title>
</head>
<header>
    <h1>Form Validation</h1>
</header>

<body>
    <div class="container">
        <h2>Welcome to the Form Validation!</h2>
        <p>This tool allows you to validate your form inputs for various insights. Please fill out the form below to get
            started.</p>
        <form action="" method="">
            <br> Name: <input type="text" id="name" name="name" placeholder="Enter your name">
            <br> Last Name: <input type="text" id="lname" name="lname" placeholder="Enter your last name">
            <br> Phone Number: <input type="number" id="phone" name="phone" placeholder="Enter your phone number">
            <br> Email: <input type="email" id="email" name="email" placeholder="Enter your email">
            <br> Password: <input type="password" id="password" name="password" placeholder="Enter your password">
            <br> <button type="submit" value="Submit">Submit</button>
        </form>
    </div>

</body>

</html>
